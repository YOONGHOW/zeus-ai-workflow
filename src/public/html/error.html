<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error - Zeus AI Workflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Main container */
        .error-container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
            animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Icon area */
        .error-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #e8e8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
        }

        .error-icon-wrap i {
            font-size: 28px;
            color: #6e6e73;
        }

        /* Status chip */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: 1px solid #d2d2d7;
            color: #6e6e73;
            padding: 5px 12px;
            border-radius: 980px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3b30;
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* Error code label */
        .error-code {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ff3b30;
            margin-bottom: 10px;
        }

        /* Headings */
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.022em;
            color: #1d1d1f;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .error-divider {
            width: 40px;
            height: 1px;
            background: #d2d2d7;
            margin: 0 auto 24px;
        }

        p {
            font-size: 15px;
            font-weight: 400;
            color: #6e6e73;
            line-height: 1.65;
            margin-bottom: 36px;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 220px;
            padding: 14px 26px;
            border-radius: 980px;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            outline: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Primary: Apple solid black */
        .btn-primary {
            background: #1d1d1f;
            color: #ffffff;
        }

        .btn-primary:hover {
            opacity: 0.82;
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Secondary: white outlined */
        .btn-secondary {
            background: #ffffff;
            color: #1d1d1f;
            border: 1px solid #d2d2d7;
        }

        .btn-secondary:hover {
            background: #f5f5f7;
        }

        /* Spinning loader during retry */
        .spinning {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Shake animation for retry failure */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.45s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="error-container">

        <!-- Dynamic icon -->
        <div class="error-icon-wrap" id="errorIconWrap">
            <i class="fa-solid fa-wifi" id="errorIcon"></i>
        </div>

        <!-- Status chip -->
        <div class="status-pill">
            <span class="status-dot"></span>
            <span id="statusText">Offline Mode</span>
        </div>

        <!-- Error label -->
        <div class="error-code" id="errorCode">Connection Error</div>

        <!-- Heading -->
        <h1 id="errorTitle">Connection Lost</h1>
        <div class="error-divider"></div>

        <!-- Message -->
        <p id="errorMsg">We couldn't connect to our systems. Please check your internet connection or backend server
            status.</p>

        <!-- Actions -->
        <div class="btn-group" id="btnGroup">
            <button id="retryBtn" class="btn btn-primary">
                <i class="fa-solid fa-arrows-rotate" id="retryIcon"></i>
                <span>Retry Connection</span>
            </button>
        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const errorType = params.get('type') || 'offline';

        const statusText = document.getElementById('statusText');
        const errorCode = document.getElementById('errorCode');
        const errorTitle = document.getElementById('errorTitle');
        const errorMsg = document.getElementById('errorMsg');
        const retryBtn = document.getElementById('retryBtn');
        const retryIcon = document.getElementById('retryIcon');
        const errorIcon = document.getElementById('errorIcon');

        // Configure page dynamically based on errorType
        if (errorType === 'server_offline') {
            statusText.textContent = 'Server Offline';
            errorCode.textContent = 'Server Error';
            errorTitle.textContent = 'Server Unavailable';
            errorMsg.textContent = 'The Zeus AI Workflow backend server is currently offline or unreachable. Please refresh the web application or try again.';
            errorIcon.className = 'fa-solid fa-server';
        } else if (errorType === '404') {
            statusText.textContent = '404 Not Found';
            errorCode.textContent = 'Error 404';
            errorTitle.textContent = 'Page Not Found';
            errorMsg.textContent = 'The page or resource you are looking for does not exist or has been moved.';
            errorIcon.className = 'fa-solid fa-magnifying-glass';
            retryBtn.style.display = 'none';
        } else {
            // Default: offline
            statusText.textContent = 'Network Offline';
            errorCode.textContent = 'Connection Error';
            errorTitle.textContent = 'No Internet Connection';
            errorMsg.textContent = 'You appear to be offline. Please check your network settings and try again.';
            errorIcon.className = 'fa-solid fa-wifi';
        }

        // Retry Connection Action
        retryBtn.addEventListener('click', async () => {
            retryIcon.classList.add('spinning');
            retryBtn.disabled = true;

            setTimeout(async () => {
                if (errorType === 'offline') {
                    if (navigator.onLine) {
                        window.location.href = '/src/public/html/main.html';
                    } else {
                        resetRetryButton();
                    }
                } else if (errorType === 'server_offline') {
                    const BASE_URL = 'http://127.0.0.1:8080';
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), 2000);
                        const res = await fetch(`${BASE_URL}/api/api_connections`, { signal: controller.signal });
                        clearTimeout(id);
                        if (res.ok || res.status < 500) {
                            window.location.href = '/src/public/html/main.html';
                        } else {
                            resetRetryButton();
                        }
                    } catch (err) {
                        resetRetryButton();
                    }
                }
            }, 1000);
        });

        function resetRetryButton() {
            retryIcon.classList.remove('spinning');
            retryBtn.disabled = false;

            // Shake the container on failure
            const container = document.querySelector('.error-container');
            container.classList.remove('shake');
            void container.offsetWidth; // trigger reflow
            container.classList.add('shake');
        }
    </script>
</body>

</html>
